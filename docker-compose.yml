version: "3.9"
services:
  app:
    build: .
    container_name: notifications-api
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      # Configuración de la aplicación
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      SERVER_PORT: ${SERVER_PORT:-8080}
      
      # Base de datos
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-notifications_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-notifications_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-notifications_pass}
      
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # Email (SendGrid)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      
      # Seguridad
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-default_encryption_key_change_in_production}
    networks:
      - notifications-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - app-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp

  redis:
    image: redis:7.2-alpine
    container_name: notifications-redis
    ports:
      - "6379:6379"
    networks:
      - notifications-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  mysql:
    image: mysql:8.0
    container_name: notifications-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_in_production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notifications_db}
      MYSQL_USER: ${MYSQL_USER:-notifications_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notifications_pass}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    networks:
      - notifications-network
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-config:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

networks:
  notifications-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local
  mysql-config:
    driver: local
  app-logs:
    driver: local
