apiVersion: v1
kind: Service
metadata:
  name: notifications-api-service
  labels:
    app: notifications-api
spec:
  selector:
    app: notifications-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
  type: LoadBalancer   # Para cloud (AWS, GCP, Azure)
  # Para Minikube, cambiar a: type: NodePort

