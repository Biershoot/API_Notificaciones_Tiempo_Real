# Perfil H2 - Base de datos embebida para desarrollo rapido
# Para activar: --spring.profiles.active=h2

# Configuracion de H2 (base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar consola H2 (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de Redis embebido para desarrollo
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1
spring.data.redis.timeout=2000ms

# Configuracion de Spring Boot Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informacion de la aplicacion para Actuator
info.app.name=API de Notificaciones en Tiempo Real (Desarrollo)
info.app.description=Microservicio con H2 y Redis para desarrollo
info.app.version=1.0.0-DEV
info.app.profile=h2-development

# Inicializacion de datos
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Desactivar Spring Security para desarrollo
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
