# Perfil H2 - Base de datos embebida para desarrollo rapido
# Para activar: --spring.profiles.active=h2

# Configuracion de H2 (base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Configuracion JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar consola H2 (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicializacion de datos
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Desactivar Spring Security para desarrollo
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
