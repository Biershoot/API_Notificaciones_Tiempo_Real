spring.application.name=notifications

# Configuracion de Base de Datos H2 por defecto (para evitar problemas de MySQL)
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Configuracion JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de Redis para Pub/Sub distribuido
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000ms

# Configuracion de inicializacion de datos (CRUCIAL)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Configuracion de Logging
logging.level.org.hibernate.SQL=DEBUG

# ========================================
# CONFIGURACION DE MONITOREO AVANZADO
# ========================================

# Actuator endpoints - Exponer métricas para Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus,httptrace,loggers
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Puerto separado para métricas (opcional pero recomendado para producción)
management.server.port=8081
management.endpoints.web.base-path=/actuator

# Etiquetas globales para métricas
management.metrics.tags.application=notifications-api
management.metrics.tags.environment=development
management.metrics.tags.version=1.0.0

# Configuración específica de métricas
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s

# Habilitar métricas JVM y sistema
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true

# Info endpoint personalizado
management.info.build.enabled=true
management.info.git.mode=full
management.info.env.enabled=true

# Configuracion del Servidor
server.port=8080

# Configuracion de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
