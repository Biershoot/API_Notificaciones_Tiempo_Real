# =======================================================
# CONFIGURACI�N PRINCIPAL DE LA APLICACI�N
# =======================================================
spring.application.name=notifications
server.port=8080
server.servlet.context-path=/

# =======================================================
# CONFIGURACI�N DE BASE DE DATOS
# =======================================================
# H2 Database (desarrollo/pruebas)
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Configuraci�n JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (solo para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Inicializaci�n de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# =======================================================
# CONFIGURACI�N DE REDIS (PARA PUB/SUB)
# =======================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.client-name=notifications-api

# =======================================================
# CONFIGURACI�N DE LOGGING
# =======================================================
logging.level.root=INFO
logging.level.com.alejandro.microservices.notifications=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/notifications-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# =======================================================
# CONFIGURACI�N DE MONITOREO (ACTUATOR/PROMETHEUS)
# =======================================================
# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,httptrace,loggers
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

# Informaci�n de la aplicaci�n
management.info.env.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true

# Etiquetas globales para m�tricas
management.metrics.tags.application=notifications-api
management.metrics.tags.environment=development
management.metrics.tags.version=2.0.0

# =======================================================
# CONFIGURACI�N DE SEGURIDAD
# =======================================================
# CORS - Configuración correcta para Spring Boot 3.x
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.max-age=3600

# =======================================================
# CONFIGURACI�N DE DOCUMENTACI�N (SWAGGER/OPENAPI)
# =======================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true

# =======================================================
# CONFIGURACI�N DE CORREO ELECTR�NICO
# =======================================================
# Configuraci�n SMTP para env�o de reportes
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu_password_o_app_token}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuraci�n de reportes autom�ticos
reports.email.from=${spring.mail.username}
reports.email.admin=admin@empresa.com
reports.email.enabled=true
reports.schedule.weekly.enabled=true
reports.schedule.monthly.enabled=true

# Configuraci�n para habilitar scheduling
spring.task.scheduling.enabled=true

# Deshabilitar health check de email para evitar errores de autenticaci�n
management.health.mail.enabled=false
